<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 880" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f8fc"/><stop offset="1" stop-color="#e9eff8"/>
    </linearGradient>
    <linearGradient id="ti" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3ccd8"/><stop offset="1" stop-color="#9aa6b6"/>
    </linearGradient>
    <linearGradient id="fe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b6470"/><stop offset="1" stop-color="#363c45"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E07B0A"/>
    </marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6FCB"/>
    </marker>
  </defs>

  <rect width="1280" height="880" fill="url(#bg)"/>
  <text x="40" y="46" font-size="26" font-weight="800" fill="#16335f">Железное загрязнение → точечная коррозия</text>
  <text x="40" y="74" font-size="15" fill="#5a6a85">Механизм, обнаружение и удаление железа на поверхности титана</text>
  <line x1="40" y1="92" x2="1240" y2="92" stroke="#cdd8e8"/>

  <!-- Panel 1: Source -->
  <rect x="40" y="120" width="360" height="320" rx="12" fill="#fff" stroke="#d4ddea"/>
  <text x="64" y="152" font-size="17" font-weight="700" fill="#16335f">1 · Источник загрязнения</text>
  <!-- titanium plate -->
  <rect x="64" y="300" width="200" height="120" rx="8" fill="url(#ti)" stroke="#7e8a9a"/>
  <text x="100" y="368" font-size="13" fill="#2b3440" font-weight="700">Титан</text>
  <text x="92" y="386" font-size="11" fill="#3c4658">поверхность</text>
  <!-- carbon steel brush -->
  <g stroke="#444b55" stroke-width="3">
    <line x1="300" y1="200" x2="300" y2="250"/>
    <line x1="288" y1="200" x2="288" y2="250"/>
    <line x1="276" y1="200" x2="276" y2="250"/>
    <line x1="264" y1="200" x2="264" y2="250"/>
  </g>
  <rect x="258" y="178" width="54" height="24" rx="4" fill="#3a414b"/>
  <text x="262" y="195" font-size="10" fill="#fff">Щётка по стали</text>
  <!-- iron particles flying -->
  <g fill="#2b3038">
    <circle cx="250" cy="270" r="4"/><circle cx="232" cy="285" r="3"/><circle cx="216" cy="298" r="3.5"/>
    <circle cx="200" cy="276" r="2.6"/><circle cx="184" cy="292" r="3"/>
  </g>
  <path d="M300,255 Q230,300 150,330" stroke="#E07B0A" stroke-width="2" fill="none" stroke-dasharray="5 5" marker-end="url(#arr)"/>
  <text x="64" y="452" font-size="11.5" fill="#3c4658">Стальная щётка, молоток, железный стеллаж, трос →</text>
  <text x="64" y="468" font-size="11.5" fill="#3c4658">частицы железа внедряются в поверхность Ti.</text>
  <text x="64" y="484" font-size="11.5" fill="#3c4658">Хранить титановую стружку отдельно от стальной.</text>

  <!-- Panel 2: Mechanism -->
  <rect x="430" y="120" width="400" height="320" rx="12" fill="#fff" stroke="#d4ddea"/>
  <text x="454" y="152" font-size="17" font-weight="700" fill="#16335f">2 · Как начинается коррозия</text>
  <!-- cross section -->
  <rect x="470" y="300" width="320" height="120" fill="url(#ti)" stroke="#7e8a9a"/>
  <!-- passive film -->
  <rect x="470" y="296" width="320" height="8" fill="#2FB6C9"/>
  <!-- broken film gap -->
  <rect x="600" y="296" width="60" height="8" fill="#fff"/>
  <!-- iron particle on top -->
  <circle cx="630" cy="288" r="14" fill="url(#fe)" stroke="#222"/>
  <!-- pit cavity -->
  <path d="M606,420 Q630,360 654,420 Z" fill="#2b3038"/>
  <ellipse cx="630" cy="420" rx="26" ry="7" fill="#1f242b"/>
  <!-- galvanic arrows -->
  <path d="M630,274 L630,250" stroke="#E07B0A" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="600" y="244" font-size="11" fill="#b85c06" font-weight="700">Fe = анод (растворяется)</text>
  <path d="M690,360 L720,360" stroke="#2F6FCB" stroke-width="2.5" marker-end="url(#arrb)"/>
  <text x="730" y="364" font-size="11" fill="#1f4f9e" font-weight="700">Ti = катод</text>
  <text x="470" y="470" font-size="11.5" fill="#3c4658">Внедрённое железо разрушает пассивную плёнку</text>
  <text x="470" y="486" font-size="11.5" fill="#3c4658">и образует гальваническую пару Fe–Ti → местное поражение.</text>

  <!-- Panel 3: Detection & removal -->
  <rect x="860" y="120" width="360" height="320" rx="12" fill="#fff" stroke="#d4ddea"/>
  <text x="884" y="152" font-size="17" font-weight="700" fill="#16335f">3 · Обнаружение и удаление</text>
  <!-- ferroxyl test -->
  <circle cx="920" cy="220" r="46" fill="#eef3fa" stroke="#cdd8e8"/>
  <g fill="#1c3fa0"><circle cx="908" cy="210" r="6"/><circle cx="930" cy="226" r="5"/><circle cx="918" cy="238" r="4"/><circle cx="940" cy="208" r="4.5"/></g>
  <text x="984" y="214" font-size="12.5" fill="#3c4658" font-weight="700">Проба Ферроксила</text>
  <text x="984" y="232" font-size="11" fill="#3c4658">K₃Fe(CN)₆ →</text>
  <text x="984" y="248" font-size="11" fill="#3c4658">синие пятна Fe²⁺</text>
  <!-- pickling beaker -->
  <rect x="884" y="300" width="70" height="80" rx="6" fill="#dff0ff" stroke="#9cc7e8"/>
  <text x="892" y="348" font-size="10" fill="#1f4f9e" font-weight="700">HNO₃+HF</text>
  <text x="966" y="332" font-size="11.5" fill="#3c4658">Травление</text>
  <text x="966" y="348" font-size="11.5" fill="#3c4658">удалить Fe</text>
  <path d="M958,340 L1180,340" stroke="#2F6FCB" stroke-width="2.5" marker-end="url(#arrb)"/>
  <!-- water rinse -->
  <circle cx="1210" cy="340" r="34" fill="#eaf6ff" stroke="#9cc7e8"/>
  <path d="M1196,328 q6,12 0,22 q-6,-10 0,-22" fill="#7ec1ef"/>
  <text x="1166" y="404" font-size="11.5" fill="#3c4658" font-weight="700">Промывка водой</text>
  <text x="884" y="424" font-size="11.5" fill="#3c4658">Обнаружьте ферроксилом, протравите в</text>
  <text x="884" y="440" font-size="11.5" fill="#3c4658">HNO₃+HF и тщательно промойте.</text>

  <!-- footer principles -->
  <rect x="40" y="470" width="1180" height="60" rx="10" fill="#16335f"/>
  <text x="64" y="497" font-size="13" fill="#fff" font-weight="700">Профилактика:</text>
  <text x="64" y="518" font-size="12.5" fill="#cfe0ff">Только инструмент для титана · не смешивать с углеродистой сталью · контроль ферроксилом после обработки · травление и промывка загрязнений</text>
</svg>
